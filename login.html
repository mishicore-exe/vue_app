
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop App | Login</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
:root{--brand:#0f6e63;--brand-dark:#0b544b;--brand-light:#e6f2f0}
body{background-color:#f7f8f7}
.navbar-brand{font-weight:700;letter-spacing:.2px}
.navbar-brand .brand-dot{color:var(--brand-light)}
.bg-brand{background-color:var(--brand)!important}
.btn-brand{background-color:var(--brand);border-color:var(--brand);color:#fff}
.btn-brand:hover{background-color:var(--brand-dark);border-color:var(--brand-dark);color:#fff}
.text-brand{color:var(--brand)!important}
.nav-link.active{color:#fff!important;font-weight:600;border-bottom:2px solid #fff}
.card-auth{max-width:420px;margin:3rem auto}
footer{color:#6c757d;font-size:.875rem}
</style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-brand shadow-sm">
<div class="container">
<a class="navbar-brand" href="index.html">Shop<span class="brand-dot">App</span></a>
<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu"><span class="navbar-toggler-icon"></span></button>
<div class="collapse navbar-collapse" id="navMenu">
<ul class="navbar-nav ms-auto mb-2 mb-lg-0">
<li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
<li class="nav-item"><a class="nav-link" href="products.html">Products</a></li>
<li class="nav-item"><a class="nav-link" href="sales.html">Sales</a></li>
<li class="nav-item"><a class="nav-link active" href="login.html">Login</a></li>
<li class="nav-item"><a class="nav-link" href="register.html">Register</a></li>
</ul>
</div>
</div>
</nav>

<div class="container" id="app">
<div class="card shadow-sm card-auth">
<div class="card-body p-4">
<h3 class="text-center text-brand mb-1">Welcome Back</h3>
<p class="text-center text-muted mb-4">Log in to manage your store</p>

<form @submit.prevent="login">
<div class="mb-3">
<label for="loginEmail" class="form-label">Email address</label>
<input type="email" v-model.trim="email" class="form-control" id="loginEmail" placeholder="you@example.com" required>
</div>

<div class="mb-3">
<label for="loginPassword" class="form-label">Password</label>
<input type="password" v-model="password" class="form-control" id="loginPassword" placeholder="Enter your password" required>
</div>

<div class="d-flex justify-content-between align-items-center mb-3">
<div class="form-check">
<input class="form-check-input" type="checkbox" id="rememberMe">
<label class="form-check-label" for="rememberMe">Remember me</label>
</div>
<a href="#" class="small text-brand text-decoration-none">Forgot password?</a>
</div>

<button type="submit" class="btn btn-brand w-100" :disabled="loading">
{{ loading ? "Logging in..." : "Log In" }}
</button>

<div class="alert alert-success mt-3" v-if="alertSuccessShow">{{ alertMessage }}</div>
<div class="alert alert-danger mt-3" v-if="alertDangerShow">{{ alertMessage }}</div>
</form>

<p class="text-center mt-4 mb-0 small">
Don't have an account?
<a href="register.html" class="text-brand text-decoration-none">Register here</a>
</p>
</div>
</div>
</div>

<footer class="text-center py-4 mt-4">&copy; 2026 Shop App. All rights reserved.</footer>

<script src="https://cdn.jsdelivr.net/npm/vue@2.7.16/dist/vue.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/axios@1.7.7/dist/axios.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
new Vue({
    el: "#app",
    data: {
        email: "",
        password: "",
        alertSuccessShow: false,
        alertDangerShow: false,
        alertMessage: "",
        loading: false
    },
    methods: {
        async login() {
            this.alertSuccessShow = false
            this.alertDangerShow = false
            this.alertMessage = ""
            this.loading = true

            try {
                const response = await axios.post(
                    "http://127.0.0.1:5000/login",
                    {
                        email: this.email.trim(),
                        password: this.password
                    }
                )

                const result = response.data || {}
                console.log("Login response data:", result)

                const token = result.token || result.access_token

                if (!token) {
                    console.error("Token missing from login response:", result)
                    throw new Error("The server did not return an authentication token.")
                }

                const rawUser = result.user && typeof result.user === "object"
                    ? result.user
                    : result

                const user = {
                    id: rawUser.id ?? rawUser.user_id,
                    full_name: rawUser.full_name ?? rawUser.name,
                    email: rawUser.email || this.email.trim()
                }

                Object.keys(user).forEach(key => {
                    if (user[key] === undefined || user[key] === null || user[key] === "") {
                        delete user[key]
                    }
                })

                localStorage.setItem("token", token)
                localStorage.setItem("user", JSON.stringify(user))

                console.log("Logged-in user:", user)
                console.log("Token saved:", Boolean(localStorage.getItem("token")))

                window.location.href = "dashboard.html"

            } catch (error) {
                console.error("Login error:", error.response?.data || error.message || error)

                this.alertDangerShow = true
                this.alertSuccessShow = false
                this.alertMessage =
                    error.response?.data?.Error ||
                    error.response?.data?.error ||
                    error.response?.data?.message ||
                    error.message ||
                    "Login failed. Please try again."
            } finally {
                this.loading = false
            }
        }
    },
    mounted() {
        if (localStorage.getItem("token")) {
            window.location.href = "dashboard.html"
        }
    }
})
</script>
</body>
</html>
