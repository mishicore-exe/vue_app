
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop App | Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        :root {
            --brand: #0f6e63;
            --brand-dark: #0b544b;
            --brand-light: #e6f2f0;
        }

        body {
            background-color: #f7f8f7;
        }

        .navbar-brand {
            font-weight: 700;
            letter-spacing: 0.2px;
        }

        .navbar-brand .brand-dot {
            color: var(--brand-light);
        }

        .bg-brand {
            background-color: var(--brand) !important;
        }

        .btn-brand {
            background-color: var(--brand);
            border-color: var(--brand);
            color: #fff;
        }

        .btn-brand:hover {
            background-color: var(--brand-dark);
            border-color: var(--brand-dark);
            color: #fff;
        }

        .text-brand {
            color: var(--brand) !important;
        }

        .nav-link.active {
            color: #fff !important;
            font-weight: 600;
            border-bottom: 2px solid #fff;
        }

        .card-auth {
            max-width: 420px;
            margin: 3rem auto;
        }

        footer {
            color: #6c757d;
            font-size: 0.875rem;
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-brand shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                Shop<span class="brand-dot">App</span>
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="products.html">Products</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="sales.html">Sales</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="login.html">Login</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="register.html">Register</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container" id="app">
        <div class="card shadow-sm card-auth">
            <div class="card-body p-4">
                <h3 class="text-center text-brand mb-1">
                    Create an Account
                </h3>

                <p class="text-center text-muted mb-4">
                    Sign up to get started with Shop App
                </p>

                <form @submit.prevent="register_user" autocomplete="off">
                    <div class="mb-3">
                        <label for="regName" class="form-label">
                            Full Name
                        </label>

                        <input
                            type="text"
                            v-model="full_name"
                            class="form-control"
                            id="regName"
                            name="new_full_name"
                            placeholder="Jane Doe"
                            autocomplete="off"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label for="regEmail" class="form-label">
                            Email address
                        </label>

                        <input
                            type="email"
                            v-model="email"
                            class="form-control"
                            id="regEmail"
                            name="new_email"
                            placeholder="you@example.com"
                            autocomplete="off"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label for="regPassword" class="form-label">
                            Password
                        </label>

                        <input
                            type="password"
                            v-model="password"
                            class="form-control"
                            id="regPassword"
                            name="new_password"
                            placeholder="Create a password"
                            autocomplete="new-password"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label for="regPhone" class="form-label">
                            Phone Number
                        </label>

                        <input
                            type="tel"
                            v-model="phone_number"
                            class="form-control"
                            id="regPhone"
                            name="new_phone_number"
                            placeholder="0712345678"
                            autocomplete="off"
                            required
                        >
                    </div>

                    <div class="form-check mb-3">
                        <input
                            class="form-check-input"
                            type="checkbox"
                            id="agreeTerms"
                            v-model="agreeTerms"
                            required
                        >

                        <label class="form-check-label" for="agreeTerms">
                            I agree to the
                            <a href="#" class="text-brand text-decoration-none">
                                Terms of Service
                            </a>
                        </label>
                    </div>

                    <button
                        type="submit"
                        class="btn btn-brand w-100"
                        :disabled="isRegistering"
                    >
                        {{ isRegistering ? "Creating Account..." : "Create Account" }}
                    </button>

                    <div class="alert alert-success mt-3" v-if="alertSuccessShow">
                        {{ alertMessage }}
                    </div>

                    <div class="alert alert-danger mt-3" v-if="alertDangerShow">
                        {{ alertMessage }}
                    </div>
                </form>

                <p class="text-center mt-4 mb-0 small">
                    Already have an account?

                    <a href="login.html" class="text-brand text-decoration-none">
                        Log in here
                    </a>
                </p>
            </div>
        </div>
    </div>

    <footer class="text-center py-4 mt-4">
        &copy; 2026 Shop App. All rights reserved.
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/vue@2.7.16/dist/vue.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.7.7/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        new Vue({
            el: "#app",

            data: {
                full_name: "",
                email: "",
                password: "",
                phone_number: "",
                agreeTerms: false,
                alertMessage: "",
                alertSuccessShow: false,
                alertDangerShow: false,
                isRegistering: false
            },

            methods: {
                clearForm() {
                    this.full_name = ""
                    this.email = ""
                    this.password = ""
                    this.phone_number = ""
                    this.agreeTerms = false

                    const form = this.$el.querySelector("form")

                    if (form) {
                        form.reset()
                    }
                },

                async register_user() {
                    if (this.isRegistering) {
                        return
                    }

                    this.alertSuccessShow = false
                    this.alertDangerShow = false
                    this.alertMessage = ""

                    if (
                        !this.full_name.trim() ||
                        !this.email.trim() ||
                        !this.password ||
                        !this.phone_number.trim()
                    ) {
                        this.alertDangerShow = true
                        this.alertMessage = "Ensure all fields are filled."
                        return
                    }

                    if (!this.agreeTerms) {
                        this.alertDangerShow = true
                        this.alertMessage = "Please agree to the Terms of Service."
                        return
                    }

                    this.isRegistering = true

                    try {
                        const response = await axios.post(
                            "http://127.0.0.1:5000/register",
                            {
                                full_name: this.full_name.trim(),
                                email: this.email.trim(),
                                password: this.password,
                                phone_number: this.phone_number.trim()
                            }
                        )

                        console.log("Register response:", response.data)

                        const token =
                            response.data.token ||
                            response.data.access_token

                        if (!token) {
                            console.error(
                                "Registration succeeded, but no token was returned.",
                                response.data
                            )

                            this.alertDangerShow = true
                            this.alertMessage =
                                "Account response received, but no login token was returned. Check your Flask register route."

                            return
                        }

                        localStorage.setItem("token", token)

                        localStorage.setItem(
                            "user",
                            JSON.stringify({
                                id: response.data.id,
                                full_name: response.data.full_name || this.full_name.trim(),
                                email: response.data.email || this.email.trim()
                            })
                        )

                        console.log("Registered user:", response.data)
                        console.log("Token saved:", !!localStorage.getItem("token"))

                        this.clearForm()

                        this.alertSuccessShow = true
                        this.alertMessage = "Account created successfully."

                        window.location.href = "dashboard.html"

                    } catch (error) {
                        console.error(
                            "Registration error:",
                            error.response?.data || error.message
                        )

                        this.alertSuccessShow = false
                        this.alertDangerShow = true

                        this.alertMessage =
                            error.response?.data?.Error ||
                            error.response?.data?.error ||
                            error.response?.data?.message ||
                            "Registration failed. Check the console for details."

                    } finally {
                        this.isRegistering = false
                    }
                }
            }
        })
    </script>

</body>

</html>
